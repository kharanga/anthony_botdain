[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travel_companion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "cryptography>=43",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.scripts]
travel-companion = "travel_companion.__main__:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pillow>=10",
]
paddleocr = [
    "paddlepaddle>=3.3",
    "paddleocr>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_companion = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
