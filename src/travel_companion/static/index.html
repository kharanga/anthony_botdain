<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>travel-companion</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  .card { background: #1d1d1d; border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 8px; font-size: 1.6rem; }
  .card p { font-size: 1.2rem; line-height: 1.4; }
  .evidence { margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid #333; list-style: none; color: #aaa; }
  .evidence li { margin: 4px 0; }
  .evidence .source { color: #777; font-size: 0.85rem; }
  #rate-form { margin-top: 16px; display: flex; gap: 8px; align-items: center; font-size: 1.2rem; }
  #rate-form input { font-size: 1.2rem; width: 8em; padding: 8px; }
  #rate-form button { font-size: 1.2rem; padding: 8px 16px; }
  #transcript-form { margin-bottom: 16px; display: flex; gap: 8px; }
  #transcript-form input { flex: 1; font-size: 1.2rem; padding: 8px; }
  #transcript-form button { font-size: 1.2rem; padding: 8px 16px; }
  #staff-phrase-button { display: block; width: 100%; margin-bottom: 16px; padding: 24px; font-size: 1.8rem; border: 0; border-radius: 12px; background: #2a5d9f; color: #fff; }
  #staff-phrase-view { position: fixed; inset: 0; overflow-y: auto; background: #fff; color: #000; padding: 24px; box-sizing: border-box; }
  #staff-phrase-view[hidden] { display: none; }
  #staff-phrase-view .phrase { margin: 0 0 28px; padding-bottom: 20px; border-bottom: 2px solid #ccc; }
  #staff-phrase-view .spanish { font-size: 2.6rem; line-height: 1.25; font-weight: 600; margin: 0 0 8px; }
  #staff-phrase-view .english { font-size: 1.2rem; color: #444; margin: 0 0 6px; }
  #staff-phrase-view .verification { display: inline-block; font-size: 1rem; padding: 2px 10px; border-radius: 999px; background: #fde68a; color: #000; }
  #staff-phrase-view .source { font-size: 0.85rem; color: #666; margin-top: 6px; }
  #staff-phrase-close { position: sticky; top: 0; float: right; font-size: 1.4rem; padding: 10px 20px; }
</style>
</head>
<body>
<main>
  <button id="staff-phrase-button" type="button">Allergy card</button>
  <form id="transcript-form">
    <input id="transcript-input" name="transcript" type="text" placeholder="Ask, e.g. show my allergy card" required>
    <button type="submit">Ask</button>
  </form>
  <section id="card" class="card"><p>Loading…</p></section>
  <form id="rate-form">
    <label for="rate-input">Rate (₡ per US dollar)</label>
    <input id="rate-input" name="colones_per_dollar" type="number" inputmode="decimal" min="0" step="any" required>
    <button type="submit">Save</button>
  </form>
  <p><a id="vault-link" href="/vault" style="color: #9cf; font-size: 1.2rem;">Vault</a></p>
</main>
<section id="staff-phrase-view" hidden>
  <button id="staff-phrase-close" type="button">Close</button>
  <div id="staff-phrase-list"></div>
</section>
<script>
  function appendTextElement(parent, tagName, text, className) {
    const element = document.createElement(tagName);
    element.textContent = text;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  }

  function renderAnswerCard(container, card) {
    container.replaceChildren();
    container.dataset.kind = card.kind;
    appendTextElement(container, "h2", card.title);
    appendTextElement(container, "p", card.body);
    const evidenceList = appendTextElement(container, "ul", "", "evidence");
    for (const item of card.evidence) {
      const row = appendTextElement(evidenceList, "li", item.text);
      appendTextElement(row, "div", item.source, "source");
    }
  }

  async function showStatusCard() {
    const container = document.getElementById("card");
    try {
      const response = await fetch("/api/status");
      renderAnswerCard(container, await response.json());
    } catch (error) {
      container.textContent = "The app is not responding: " + error;
    }
  }

  async function showRateCardAfter(request) {
    const container = document.getElementById("card");
    try {
      const response = await request;
      const body = await response.json();
      if (!response.ok) {
        container.textContent = "That Rate was not saved. Enter a number above zero.";
        return;
      }
      renderAnswerCard(container, body);
    } catch (error) {
      container.textContent = "The app is not responding: " + error;
    }
  }

  function saveRate(event) {
    event.preventDefault();
    const colonesPerDollar = Number(document.getElementById("rate-input").value);
    showRateCardAfter(fetch("/api/rate", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colones_per_dollar: colonesPerDollar }),
    }));
  }

  function renderStaffPhraseCard(card) {
    const list = document.getElementById("staff-phrase-list");
    list.replaceChildren();
    card.phrases.forEach((phrase, index) => {
      const block = appendTextElement(list, "article", "", "phrase");
      block.dataset.phrase = phrase.name;
      appendTextElement(block, "p", phrase.spanish, "spanish");
      appendTextElement(block, "p", phrase.english, "english");
      appendTextElement(block, "span", phrase.verification, "verification");
      appendTextElement(block, "div", card.evidence[index].source, "source");
    });
  }

  function openStaffPhraseView(card) {
    renderStaffPhraseCard(card);
    document.getElementById("staff-phrase-view").hidden = false;
  }

  async function showStaffPhraseCard(phraseName) {
    const query = phraseName ? "?phrase=" + encodeURIComponent(phraseName) : "";
    try {
      const response = await fetch("/api/staff-phrase" + query);
      openStaffPhraseView(await response.json());
    } catch (error) {
      document.getElementById("card").textContent = "The app is not responding: " + error;
    }
  }

  function showRoutedCard(card) {
    if (card.kind === "staff_phrase") {
      openStaffPhraseView(card);
      return;
    }
    renderAnswerCard(document.getElementById("card"), card);
  }

  async function askTranscript(event) {
    event.preventDefault();
    const transcript = document.getElementById("transcript-input").value;
    try {
      const response = await fetch("/api/transcript", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ transcript: transcript }),
      });
      showRoutedCard(await response.json());
    } catch (error) {
      document.getElementById("card").textContent = "The app is not responding: " + error;
    }
  }

  document.getElementById("staff-phrase-button").addEventListener("click", () => showStaffPhraseCard());
  document.getElementById("staff-phrase-close").addEventListener("click", () => {
    document.getElementById("staff-phrase-view").hidden = true;
  });
  document.getElementById("rate-form").addEventListener("submit", saveRate);
  document.getElementById("transcript-form").addEventListener("submit", askTranscript);
  showStatusCard();
</script>
</body>
</html>
