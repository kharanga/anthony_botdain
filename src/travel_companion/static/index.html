<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>travel-companion</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  .card { background: #1d1d1d; border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 8px; font-size: 1.6rem; }
  .card p { font-size: 1.2rem; line-height: 1.4; }
  .evidence { margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid #333; list-style: none; color: #aaa; }
  .evidence li { margin: 4px 0; }
  .evidence .source { color: #777; font-size: 0.85rem; }
  #rate-form { margin-top: 16px; display: flex; gap: 8px; align-items: center; font-size: 1.2rem; }
  #rate-form input { font-size: 1.2rem; width: 8em; padding: 8px; }
  #rate-form button { font-size: 1.2rem; padding: 8px 16px; }
  #push-to-talk { margin-top: 16px; width: 100%; min-height: 96px; font-size: 1.6rem; border: 0; border-radius: 12px; background: #2a5; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #push-to-talk.recording { background: #c33; }
  #push-to-talk:disabled { background: #555; }
</style>
</head>
<body>
<main>
  <section id="card" class="card"><p>Loading…</p></section>
  <button id="push-to-talk" type="button">Hold to talk</button>
  <form id="rate-form">
    <label for="rate-input">Rate (₡ per US dollar)</label>
    <input id="rate-input" name="colones_per_dollar" type="number" inputmode="decimal" min="0" step="any" required>
    <button type="submit">Save</button>
  </form>
  <p><a id="vault-link" href="/vault" style="color: #9cf; font-size: 1.2rem;">Vault</a></p>
</main>
<script>
  function appendTextElement(parent, tagName, text, className) {
    const element = document.createElement(tagName);
    element.textContent = text;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  }

  function renderAnswerCard(container, card) {
    container.replaceChildren();
    container.dataset.kind = card.kind;
    appendTextElement(container, "h2", card.title);
    appendTextElement(container, "p", card.body);
    const evidenceList = appendTextElement(container, "ul", "", "evidence");
    for (const item of card.evidence) {
      const row = appendTextElement(evidenceList, "li", item.text);
      appendTextElement(row, "div", item.source, "source");
    }
  }

  async function showStatusCard() {
    const container = document.getElementById("card");
    try {
      const response = await fetch("/api/status");
      renderAnswerCard(container, await response.json());
    } catch (error) {
      container.textContent = "The app is not responding: " + error;
    }
  }

  async function showRateCardAfter(request) {
    const container = document.getElementById("card");
    try {
      const response = await request;
      const body = await response.json();
      if (!response.ok) {
        container.textContent = "That Rate was not saved. Enter a number above zero.";
        return;
      }
      renderAnswerCard(container, body);
    } catch (error) {
      container.textContent = "The app is not responding: " + error;
    }
  }

  function saveRate(event) {
    event.preventDefault();
    const colonesPerDollar = Number(document.getElementById("rate-input").value);
    showRateCardAfter(fetch("/api/rate", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colones_per_dollar: colonesPerDollar }),
    }));
  }

  const WHISPER_SAMPLE_RATE = 16000;
  const pushToTalkButton = document.getElementById("push-to-talk");
  let activeRecording = null;

  function mergedSamples(chunks) {
    const length = chunks.reduce((total, chunk) => total + chunk.length, 0);
    const samples = new Float32Array(length);
    let offset = 0;
    for (const chunk of chunks) {
      samples.set(chunk, offset);
      offset += chunk.length;
    }
    return samples;
  }

  function wavBlobFrom(samples, sampleRate) {
    const bytesPerSample = 2;
    const view = new DataView(new ArrayBuffer(44 + samples.length * bytesPerSample));
    const writeText = (offset, text) => [...text].forEach((letter, index) => view.setUint8(offset + index, letter.charCodeAt(0)));
    writeText(0, "RIFF");
    view.setUint32(4, 36 + samples.length * bytesPerSample, true);
    writeText(8, "WAVE");
    writeText(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * bytesPerSample, true);
    view.setUint16(32, bytesPerSample, true);
    view.setUint16(34, 16, true);
    writeText(36, "data");
    view.setUint32(40, samples.length * bytesPerSample, true);
    samples.forEach((sample, index) => {
      const clamped = Math.max(-1, Math.min(1, sample));
      view.setInt16(44 + index * bytesPerSample, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true);
    });
    return new Blob([view], { type: "audio/wav" });
  }

  async function startRecording(event) {
    event.preventDefault();
    if (activeRecording) return;
    pushToTalkButton.setPointerCapture(event.pointerId);
    activeRecording = { chunks: [] };
    pushToTalkButton.classList.add("recording");
    pushToTalkButton.textContent = "Listening… let go to ask";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
      const audioContext = new AudioContext({ sampleRate: WHISPER_SAMPLE_RATE });
      const source = audioContext.createMediaStreamSource(stream);
      const processor = audioContext.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (audioEvent) => activeRecording && activeRecording.chunks.push(new Float32Array(audioEvent.inputBuffer.getChannelData(0)));
      source.connect(processor);
      processor.connect(audioContext.destination);
      Object.assign(activeRecording, { stream, audioContext, processor });
      if (activeRecording.releasedEarly) stopRecording();
    } catch (error) {
      activeRecording = null;
      resetPushToTalkButton();
      document.getElementById("card").textContent = "The microphone is not available: " + error;
    }
  }

  function resetPushToTalkButton() {
    pushToTalkButton.classList.remove("recording");
    pushToTalkButton.disabled = false;
    pushToTalkButton.textContent = "Hold to talk";
  }

  async function stopRecording() {
    const recording = activeRecording;
    if (!recording) return;
    if (!recording.audioContext) {
      recording.releasedEarly = true;
      return;
    }
    activeRecording = null;
    recording.processor.disconnect();
    recording.stream.getTracks().forEach((track) => track.stop());
    await recording.audioContext.close();
    pushToTalkButton.classList.remove("recording");
    pushToTalkButton.disabled = true;
    pushToTalkButton.textContent = "Thinking…";
    const container = document.getElementById("card");
    try {
      const response = await fetch("/api/speech", {
        method: "POST",
        headers: { "Content-Type": "audio/wav" },
        body: wavBlobFrom(mergedSamples(recording.chunks), recording.audioContext.sampleRate),
      });
      renderAnswerCard(container, await response.json());
    } catch (error) {
      container.textContent = "The app is not responding: " + error;
    }
    resetPushToTalkButton();
  }

  pushToTalkButton.addEventListener("pointerdown", startRecording);
  pushToTalkButton.addEventListener("pointerup", stopRecording);
  pushToTalkButton.addEventListener("pointercancel", stopRecording);
  pushToTalkButton.addEventListener("contextmenu", (event) => event.preventDefault());

  document.getElementById("rate-form").addEventListener("submit", saveRate);
  showStatusCard();
</script>
</body>
</html>
